name: Keep Backend Alive

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Primary Backend
        run: |
          curl -s -o /dev/null -w "Primary backend status: %{http_code}\n" https://jobseeker-backend-p3c3.onrender.com/api/health
          sleep 5
      - name: Ping Secondary Backend
        run: |
          curl -s -o /dev/null -w "Secondary backend status: %{http_code}\n" https://jobseeker-backend-yxhi.onrender.com/api/health